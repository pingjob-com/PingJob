<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src * 'self' 'unsafe-inline' 'unsafe-eval' data: gap: content:; connect-src * 'self' https://www.pingjob.com wss: ws:;">
    <title>PingJob - Job Board & Professional Networking Platform</title>
    <meta name="description" content="PingJob is a comprehensive job board and professional networking platform. Find jobs, connect with professionals, and build your career." />
    <meta name="keywords" content="job board, jobs, careers, employment, professional networking, hiring" />
    
    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="PingJob - Find Your Next Opportunity" />
    <meta property="og:description" content="Discover job opportunities and professional networking on PingJob." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.pingjob.com/" />
    
    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PingJob - Job Board & Professional Networking" />
    <meta name="twitter:description" content="Find jobs and professional opportunities on PingJob." />
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://www.pingjob.com/" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    
    <!-- Preload Logo from CDN -->
    <link rel="preload" as="image" href="https://cdn.pingjob.com/logo.webp" />
    
    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-BQEKEPGNZN"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-BQEKEPGNZN');
    </script>
    
    <!-- Google AdSense (for logged-in users) -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9555763610767023"
     crossorigin="anonymous"></script>
    
    <!-- Google Ad Manager (GPT) for non-logged-in users -->
    <script async src="https://securepubads.g.doubleclick.net/tag/js/gpt.js" crossorigin="anonymous"></script>
    <script>
      window.googletag = window.googletag || {cmd: []};
      // Note: enableServices() is called after slots are defined in GoogleAdManager component
    </script>
  </head>
  <body>
    <div id="root" style="display: block; visibility: visible; opacity: 1; width: 100%; min-height: 100vh;"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
